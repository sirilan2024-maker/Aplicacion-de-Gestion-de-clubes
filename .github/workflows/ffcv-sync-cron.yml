name: Sincronizacion Horaria FFCV y Liga Brave Sporting Saladar

on:
  schedule:
    # Solo entre semana: martes, miércoles y viernes a las 13:00 UTC (~14:00 invierno / 15:00 verano España)
    # Los fines de semana se disparan automáticamente por Upstash QStash al acabar cada partido (+30 min y +90 min)
    - cron: '0 13 * * 2,3,5'
  workflow_dispatch: # Permite ejecutarlo manualmente o vía API (post-partido Liga Brave)
    inputs:
      mode:
        description: 'Modo de sincronización (all = FFCV + Liga Brave, brave_only = solo Liga Brave)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - brave_only

# Evita ejecuciones simultáneas si una sincronización previa tarda más de lo esperado
concurrency:
  group: ffcv-sync-cron
  cancel-in-progress: false

jobs:
  sync-ffcv:
    name: Sincronizar FFCV y Liga Brave (Partidos, Actas y Clasificaciones)
    runs-on: ubuntu-latest
    steps:
      - name: Pre-capturar datos de Liga Brave (Apuntamelo) y disparar sincronizacion
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || '1c2116fd25f2d9b436b10705daae6f053a84dea1957d9effaee3dd5238d8c081' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::El secreto CRON_SECRET no está configurado."
            exit 1
          fi

          TMP_WORK_DIR=$(mktemp -d)
          chmod 700 "$TMP_WORK_DIR"
          cleanup() {
            rm -rf "$TMP_WORK_DIR"
          }
          trap cleanup EXIT
          trap 'cleanup; trap - INT; kill -INT $$' INT
          trap 'cleanup; trap - TERM; kill -TERM $$' TERM

          AUTH_HEADER_FILE="$TMP_WORK_DIR/auth.header"
          touch "$AUTH_HEADER_FILE"
          chmod 600 "$AUTH_HEADER_FILE"
          printf "Authorization: Bearer %s\n" "$CRON_SECRET" > "$AUTH_HEADER_FILE"

          echo "Instalando curl_cffi para bypass de Cloudflare en Apuntamelo..."
          pip install --quiet curl_cffi || true

          python3 - << 'EOF' > "$TMP_WORK_DIR/apuntamelo_payload.json"
          import json
          try:
              from curl_cffi import requests as creq
              def fetch_json(url):
                  r = creq.get(url, impersonate="chrome120", verify=False, timeout=15, headers={
                      "Accept": "application/json, text/javascript, */*; q=0.01",
                      "X-Requested-With": "XMLHttpRequest",
                      "Referer": "https://apuntamelo.com/"
                  })
                  if r.status_code == 200:
                      return r.json()
                  return None
          except Exception:
              import urllib.request, ssl
              ctx = ssl._create_unverified_context()
              def fetch_json(url):
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "X-Requested-With": "XMLHttpRequest"})
                  with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                      return json.loads(resp.read().decode("utf-8"))

          cache = {}
          base_urls = [
              "https://apuntamelo.com/obtenerClasificacion?id=4660",
              "https://apuntamelo.com/obtenerInfoEquipo?equipo=33431",
              "https://apuntamelo.com/obtenerPartidosPorJornada?organizacion=29&grupo=4624",
              "https://apuntamelo.com/obtenerClasificacion?id=4659",
              "https://apuntamelo.com/obtenerInfoEquipo?equipo=33383",
              "https://apuntamelo.com/obtenerPartidosPorJornada?organizacion=29&grupo=4623",
          ]
          match_ids = set()
          for u in base_urls:
              try:
                  data = fetch_json(u)
                  if data is not None:
                      cache[u] = data
                      if "obtenerPartidosPorJornada" in u and isinstance(data, list):
                          for m in data:
                              if m.get("Goles_A") is not None and m.get("Goles_B") is not None:
                                  fk_a = int(m.get("FK_EquipoLiga_A") or 0)
                                  fk_b = int(m.get("FK_EquipoLiga_B") or 0)
                                  if fk_a in (33431, 33383) or fk_b in (33431, 33383):
                                      match_ids.add(str(m.get("Id")))
              except Exception:
                  pass

          endpoints = [
              "obtenerInfoPartido",
              "obtenerNoticiasPartido",
              "obtenerPuntuacionesPartido",
              "obtenerGolesPartidoA",
              "obtenerGolesPartidoB"
          ]
          for mid in match_ids:
              for ep in endpoints:
                  u = f"https://apuntamelo.com/{ep}?id={mid}"
                  try:
                      data = fetch_json(u)
                      if data is not None:
                          cache[u] = data
                  except Exception:
                      pass

          print(json.dumps({"apuntameloCache": cache}))
          EOF

          echo "Enviando sincronizacion (mode=${{ inputs.mode || 'all' }})..."
          EXTRA_QUERY=""
          if [ "${{ inputs.mode }}" = "brave_only" ]; then
            EXTRA_QUERY="?braveOnly=true"
          fi
          set +e
          HTTP_STATUS=$(curl -s -S --connect-timeout 15 --max-time 120 -o "$TMP_WORK_DIR/response.body" -w "%{http_code}" \
            -H "@$AUTH_HEADER_FILE" \
            -H "Content-Type: application/json" \
            --data-binary "@$TMP_WORK_DIR/apuntamelo_payload.json" \
            -X POST "https://app.clubsportingsaladar.com/api/ffcv/cron$EXTRA_QUERY")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Error de conexión al invocar el endpoint FFCV (curl exit: $CURL_EXIT)"
            exit "$CURL_EXIT"
          fi
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Error en la sincronizacion: Codigo HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Sincronizacion completada exitosamente."
