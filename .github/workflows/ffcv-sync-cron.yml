name: Sincronizacion Horaria FFCV y Liga Brave Sporting Saladar

on:
  schedule:
    # Fines de semana (sábados y domingos de 08:00 a 20:00 UTC): cada hora en punto para captar resultados y actas en jornada
    - cron: '0 8-20 * * 6,0'
    # Días laborables (lunes a viernes): 2 veces al día (08:00 y 20:00 UTC) para sincronización de mantenimiento
    - cron: '0 8,20 * * 1-5'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  sync-ffcv:
    name: Sincronizar FFCV y Liga Brave (Partidos, Actas y Clasificaciones)
    runs-on: ubuntu-latest
    steps:
      - name: Disparar endpoint de sincronizacion FFCV y Liga Brave
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET || '1c2116fd25f2d9b436b10705daae6f053a84dea1957d9effaee3dd5238d8c081' }}
        run: |
          echo "Iniciando sincronizacion horaria FFCV y Liga Brave para Sporting Saladar..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X GET "https://app.clubsportingsaladar.com/api/ffcv/cron?secret=$CRON_SECRET")
          echo "$RESPONSE"
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -e 's/.*HTTP_STATUS://')
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error en la sincronizacion: Codigo HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Sincronizacion completada exitosamente."
